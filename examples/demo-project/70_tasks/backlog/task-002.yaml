title: "Создать API для управления каталогом товаров"

description: |
  Разработать REST API для работы с каталогом товаров:
  - CRUD операции для товаров
  - Фильтрация и поиск
  - Пагинация
  - Сортировка

  ## Endpoints
  - GET /api/products - список товаров
  - GET /api/products/{id} - деталь товара
  - POST /api/products - создание (admin)
  - PUT /api/products/{id} - обновление (admin)
  - DELETE /api/products/{id} - удаление (admin)

