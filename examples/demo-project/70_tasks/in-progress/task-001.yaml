title: "Реализовать систему аутентификации пользователей"

description: |
  Необходимо реализовать полноценную систему аутентификации:
  - Регистрация новых пользователей
  - Вход по email/password
  - JWT токены для API
  - Refresh tokens
  - Валидация email

  ## Acceptance Criteria
  - [ ] Пользователь может зарегистрироваться
  - [ ] Пользователь может войти в систему
  - [ ] Токены имеют срок действия 1 час
  - [ ] Есть endpoint для refresh
  - [ ] Пароли хешируются (bcrypt)

